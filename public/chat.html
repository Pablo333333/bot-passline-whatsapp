<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PassBot - Chat de Prueba</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #e5ddd5; height: 100vh; display: flex; flex-direction: column; }
    .header { background: #075e54; color: white; padding: 15px 20px; display: flex; align-items: center; gap: 12px; }
    .header .avatar { width: 40px; height: 40px; background: #25d366; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; }
    .header h1 { font-size: 16px; font-weight: 600; }
    .header p { font-size: 12px; opacity: 0.8; }
    .chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 8px; }
    .message { max-width: 75%; padding: 8px 12px; border-radius: 8px; font-size: 14px; line-height: 1.4; white-space: pre-wrap; word-wrap: break-word; }
    .message.user { align-self: flex-end; background: #dcf8c6; border-bottom-right-radius: 2px; }
    .message.bot { align-self: flex-start; background: white; border-bottom-left-radius: 2px; }
    .message .time { font-size: 11px; color: #999; text-align: right; margin-top: 4px; }
    .typing { align-self: flex-start; background: white; padding: 12px 16px; border-radius: 8px; font-size: 14px; color: #999; }
    .input-area { background: #f0f0f0; padding: 10px 15px; display: flex; gap: 10px; align-items: center; }
    .input-area input { flex: 1; padding: 10px 15px; border: none; border-radius: 20px; font-size: 14px; outline: none; }
    .input-area button { background: #075e54; color: white; border: none; border-radius: 50%; width: 42px; height: 42px; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .input-area button:hover { background: #064e46; }
    .input-area button:disabled { background: #999; cursor: not-allowed; }
    .name-form { display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; gap: 15px; padding: 20px; }
    .name-form input { padding: 12px 20px; border: 2px solid #075e54; border-radius: 25px; font-size: 16px; text-align: center; outline: none; width: 280px; }
    .name-form button { padding: 12px 30px; background: #25d366; color: white; border: none; border-radius: 25px; font-size: 16px; cursor: pointer; font-weight: 600; }
    .name-form h2 { color: #075e54; }
    .name-form p { color: #666; font-size: 14px; }
  </style>
</head>
<body>
  <div class="header">
    <div class="avatar">🤖</div>
    <div>
      <h1>PassBot</h1>
      <p id="status-text">Asistente virtual de Passline</p>
    </div>
  </div>

  <div id="name-screen" class="name-form">
    <h2>🎟️ PassBot - Chat de Prueba</h2>
    <p>Ingresá tu nombre para comenzar</p>
    <input type="text" id="user-name" placeholder="Tu nombre..." autofocus>
    <input type="text" id="user-phone" placeholder="Tu teléfono (ej: 593988382233)">
    <button onclick="startChat()">Iniciar Chat ➜</button>
  </div>

  <div id="chat-screen" style="display:none; flex:1; flex-direction:column;">
    <div class="chat-container" id="chat-container"></div>
    <div class="input-area">
      <input type="text" id="message-input" placeholder="Escribe un mensaje..." onkeypress="if(event.key==='Enter')sendMessage()">
      <button id="send-btn" onclick="sendMessage()">➤</button>
    </div>
  </div>

  <script>
    let userName = '';
    let userPhone = '';

    function startChat() {
      userName = document.getElementById('user-name').value.trim() || 'Usuario';
      userPhone = document.getElementById('user-phone').value.trim() || '593000000000';
      document.getElementById('name-screen').style.display = 'none';
      const chatScreen = document.getElementById('chat-screen');
      chatScreen.style.display = 'flex';
      addMessage('bot', '¡Hola ' + userName + '! 👋 Soy PassBot, el asistente virtual de Passline. ¿En qué puedo ayudarte?');
      document.getElementById('message-input').focus();
    }

    function addMessage(type, text) {
      const container = document.getElementById('chat-container');
      const div = document.createElement('div');
      div.className = 'message ' + type;
      const time = new Date().toLocaleTimeString('es-EC', {hour:'2-digit', minute:'2-digit'});
      div.innerHTML = text.replace(/\n/g,'<br>') + '<div class="time">' + time + '</div>';
      container.appendChild(div);
      container.scrollTop = container.scrollHeight;
    }

    function showTyping() {
      const container = document.getElementById('chat-container');
      const div = document.createElement('div');
      div.className = 'typing';
      div.id = 'typing-indicator';
      div.textContent = '⏳ PassBot está escribiendo...';
      container.appendChild(div);
      container.scrollTop = container.scrollHeight;
    }

    function hideTyping() {
      const el = document.getElementById('typing-indicator');
      if (el) el.remove();
    }

    async function sendMessage() {
      const input = document.getElementById('message-input');
      const text = input.value.trim();
      if (!text) return;

      input.value = '';
      addMessage('user', text);
      document.getElementById('send-btn').disabled = true;
      showTyping();

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ text: text, userName: userName, phoneNumber: userPhone })
        });
        const data = await res.json();
        hideTyping();
        addMessage('bot', data.response || 'Sin respuesta');
      } catch(err) {
        hideTyping();
        addMessage('bot', '❌ Error de conexión con el servidor');
      }
      document.getElementById('send-btn').disabled = false;
      input.focus();
    }

    document.getElementById('user-name').addEventListener('keypress', function(e) { if(e.key==='Enter') document.getElementById('user-phone').focus(); });
    document.getElementById('user-phone').addEventListener('keypress', function(e) { if(e.key==='Enter') startChat(); });
  </script>
</body>
</html>
